<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合同列表 - 银行合同管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['IBM Plex Sans', 'sans-serif'] },
                    colors: {
                        bank: {
                            50: '#f0f4f8', 100: '#d9e2ec', 200: '#bcccdc', 300: '#9fb3c8',
                            400: '#829ab1', 500: '#627d98', 600: '#486581', 700: '#334e68',
                            800: '#243b53', 900: '#102a43', 950: '#0a1a2e',
                        },
                        gold: { 400: '#d69e2e', 500: '#c59a1d', 600: '#b08a1a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bank-50 min-h-screen font-sans">
    <!-- Header -->
    <header class="bg-gradient-to-r from-bank-900 to-bank-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <svg class="w-8 h-8 text-gold-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    <span class="text-white text-xl font-semibold">银行合同管理系统</span>
                </div>
                <nav class="flex space-x-4">
                    <a href="/" class="text-white bg-bank-700 px-3 py-2 rounded-md text-sm font-medium">合同列表</a>
                    <a href="/contracts/new" class="text-bank-100 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">新建合同</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 搜索区域 -->
        <div class="glass rounded-xl shadow-sm border border-bank-100 p-6 mb-6">
            <form action="/" method="get" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-sm font-medium text-bank-600 mb-1">合同编号</label>
                    <input type="text" name="contractNo" th:value="${contractNo}"
                           placeholder="请输入合同编号"
                           class="w-full px-4 py-2 border border-bank-200 rounded-lg focus:ring-2 focus:ring-bank-500 focus:border-bank-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-bank-600 mb-1">客户名称</label>
                    <input type="text" name="customerName" th:value="${customerName}"
                           placeholder="请输入客户名称"
                           class="w-full px-4 py-2 border border-bank-200 rounded-lg focus:ring-2 focus:ring-bank-500 focus:border-bank-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-bank-600 mb-1">合同状态</label>
                    <select name="status" class="w-full px-4 py-2 border border-bank-200 rounded-lg focus:ring-2 focus:ring-bank-500 focus:border-bank-500 outline-none transition-all bg-white">
                        <option value="">全部状态</option>
                        <option value="DRAFT" th:selected="${status == 'DRAFT'}">草稿</option>
                        <option value="PENDING" th:selected="${status == 'PENDING'}">待审批</option>
                        <option value="APPROVED" th:selected="${status == 'APPROVED'}">已审批</option>
                        <option value="REJECTED" th:selected="${status == 'REJECTED'}">已拒绝</option>
                        <option value="ARCHIVED" th:selected="${status == 'ARCHIVED'}">已归档</option>
                    </select>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-bank-700 hover:bg-bank-600 text-white px-4 py-2 rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        查询
                    </button>
                    <a href="/" class="px-4 py-2 border border-bank-200 text-bank-600 rounded-lg hover:bg-bank-50 transition-colors">重置</a>
                </div>
            </form>
        </div>

        <!-- 操作栏 -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-semibold text-bank-800">合同列表</h2>
            <a href="/contracts/new" class="bg-gold-400 hover:bg-gold-500 text-white px-4 py-2 rounded-lg font-medium transition-colors flex items-center gap-2 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                新建合同
            </a>
        </div>

        <!-- 表格 -->
        <div class="glass rounded-xl shadow-sm border border-bank-100 overflow-hidden">
            <table class="w-full">
                <thead class="bg-bank-100">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-bank-600 uppercase tracking-wider">合同编号</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-bank-600 uppercase tracking-wider">合同名称</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-bank-600 uppercase tracking-wider">客户名称</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-bank-600 uppercase tracking-wider">金额(元)</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-bank-600 uppercase tracking-wider">风险等级</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-bank-600 uppercase tracking-wider">状态</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-bank-600 uppercase tracking-wider">签署日期</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-bank-600 uppercase tracking-wider">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-bank-100">
                    <tr th:each="contract : ${page.records}" class="hover:bg-bank-50 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-bank-700" th:text="${contract.contractNo}">CT202601001</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-bank-600" th:text="${contract.contractName}">流动资金贷款合同</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-bank-600" th:text="${contract.customerName}">深圳市科技有限公司</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-bank-700" th:text="${#numbers.formatDecimal(contract.amount, 1, 'COMMA', 2, 'POINT')}">5,000,000.00</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span th:class="${'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ' +
                                (contract.riskLevel == 'LOW' ? 'bg-green-100 text-green-800' :
                                (contract.riskLevel == 'MEDIUM' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800'))}"
                                  th:text="${contract.riskLevel == 'LOW' ? '低风险' : (contract.riskLevel == 'MEDIUM' ? '中风险' : '高风险')}">中风险</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span th:class="${'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ' +
                                (contract.status == 'DRAFT' ? 'bg-orange-100 text-orange-800' :
                                (contract.status == 'PENDING' ? 'bg-blue-100 text-blue-800' :
                                (contract.status == 'APPROVED' ? 'bg-green-100 text-green-800' :
                                (contract.status == 'REJECTED' ? 'bg-red-100 text-red-800' : 'bg-gray-100 text-gray-800'))))}"
                                  th:text="${contract.status == 'DRAFT' ? '草稿' :
                                  (contract.status == 'PENDING' ? '待审批' :
                                  (contract.status == 'APPROVED' ? '已审批' :
                                  (contract.status == 'REJECTED' ? '已拒绝' : '已归档')))}">草稿</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-bank-500" th:text="${#temporals.format(contract.signDate, 'yyyy-MM-dd')}">2026-01-15</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm space-x-2">
                            <a th:href="@{/contracts/{id}(id=${contract.id})}" class="text-bank-600 hover:text-bank-800 font-medium transition-colors">查看</a>
                            <a th:href="@{/contracts/{id}/edit(id=${contract.id})}" class="text-gold-400 hover:text-gold-600 font-medium transition-colors">编辑</a>
                            <a th:href="@{/contracts/{id}/delete(id=${contract.id})}"
                               class="text-red-500 hover:text-red-700 font-medium transition-colors"
                               onclick="return confirm('确定要删除该合同吗？')">删除</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(page.records)}">
                        <td colspan="8" class="px-6 py-12 text-center text-bank-400">暂无数据</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 分页 -->
        <div class="mt-6 flex justify-center" th:if="${page.pages > 1}">
            <nav class="flex items-center gap-1">
                <a th:href="@{/(pageNum=1, contractNo=${contractNo}, customerName=${customerName}, status=${status})}"
                   class="px-3 py-2 rounded-lg text-sm font-medium text-bank-600 hover:bg-bank-100 transition-colors">首页</a>
                <a th:href="@{/(pageNum=${page.current - 1}, contractNo=${contractNo}, customerName=${customerName}, status=${status})}"
                   th:if="${page.current > 1}"
                   class="px-3 py-2 rounded-lg text-sm font-medium text-bank-600 hover:bg-bank-100 transition-colors">上一页</a>

                <span th:each="i : ${#numbers.sequence(1, page.pages)}" th:if="${page.pages <= 7 || (i <= 3 || i > page.current - 2 && i < page.current + 2 || i > page.pages - 3)}">
                    <a th:href="@{/(pageNum=${i}, contractNo=${contractNo}, customerName=${customerName}, status=${status})}"
                       th:class="${i == page.current ? 'bg-bank-700 text-white' : 'text-bank-600 hover:bg-bank-100'}"
                       class="px-3 py-2 rounded-lg text-sm font-medium transition-colors"
                       th:text="${i}">1</a>
                </span>

                <a th:href="@{/(pageNum=${page.current + 1}, contractNo=${contractNo}, customerName=${customerName}, status=${status})}"
                   th:if="${page.current < page.pages}"
                   class="px-3 py-2 rounded-lg text-sm font-medium text-bank-600 hover:bg-bank-100 transition-colors">下一页</a>
                <a th:href="@{/(pageNum=${page.pages}, contractNo=${contractNo}, customerName=${customerName}, status=${status})}"
                   class="px-3 py-2 rounded-lg text-sm font-medium text-bank-600 hover:bg-bank-100 transition-colors">末页</a>
            </nav>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-bank-900 text-bank-300 py-4 mt-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm">
            <p>&copy; 2026 银行合同管理系统. 版权所有.</p>
        </div>
    </footer>
</body>
</html>
