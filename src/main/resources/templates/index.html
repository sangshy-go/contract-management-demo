<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>合同列表 - 银行合同管理系统</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .header { background: #1a237e; color: white; padding: 15px 20px; margin: -20px -20px 20px -20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .search-box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .search-box table { width: auto; }
        .search-box td { padding: 5px 10px; border: none; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #e8eaf6; }
        .btn { padding: 6px 12px; border: none; cursor: pointer; border-radius: 4px; font-size: 14px; }
        .btn-primary { background: #1a237e; color: white; }
        .btn-success { background: #4caf50; color: white; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .status-DRAFT { background: #fff3e0; color: #ff9800; }
        .status-PENDING { background: #e3f2fd; color: #2196f3; }
        .status-APPROVED { background: #e8f5e9; color: #4caf50; }
        .status-REJECTED { background: #ffebee; color: #f44336; }
        .status-ARCHIVED { background: #f5f5f5; color: #9e9e9e; }
        .risk-LOW { color: #4caf50; }
        .risk-MEDIUM { color: #ff9800; }
        .risk-HIGH { color: #f44336; }
        .pagination { margin-top: 20px; text-align: center; }
        .pagination a { padding: 8px 12px; margin: 0 4px; background: white; color: #1a237e; text-decoration: none; border-radius: 4px; }
        .pagination a.active { background: #1a237e; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏦 银行合同管理系统</h1>
    </div>
    <div class="container">
        <!-- 搜索表单 -->
        <div class="search-box">
            <form action="/" method="get">
                <table>
                    <tr>
                        <td>合同编号: <input type="text" name="contractNo" th:value="${contractNo}" placeholder="请输入合同编号"></td>
                        <td>客户名称: <input type="text" name="customerName" th:value="${customerName}" placeholder="请输入客户名称"></td>
                        <td>状态:
                            <select name="status">
                                <option value="">全部</option>
                                <option value="DRAFT" th:selected="${status == 'DRAFT'}">草稿</option>
                                <option value="PENDING" th:selected="${status == 'PENDING'}">待审批</option>
                                <option value="APPROVED" th:selected="${status == 'APPROVED'}">已审批</option>
                                <option value="REJECTED" th:selected="${status == 'REJECTED'}">已拒绝</option>
                                <option value="ARCHIVED" th:selected="${status == 'ARCHIVED'}">已归档</option>
                            </select>
                        </td>
                        <td><button type="submit" class="btn btn-primary">🔍 查询</button></td>
                        <td><a href="/" class="btn">重置</a></td>
                    </tr>
                </table>
            </form>
        </div>

        <!-- 操作按钮 -->
        <div style="margin-bottom: 15px;">
            <a href="/contracts/new" class="btn btn-primary">➕ 新建合同</a>
        </div>

        <!-- 合同列表 -->
        <table>
            <thead>
                <tr>
                    <th>合同编号</th>
                    <th>合同名称</th>
                    <th>客户名称</th>
                    <th>金额(元)</th>
                    <th>风险等级</th>
                    <th>状态</th>
                    <th>签署日期</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="contract : ${page.records}">
                    <td th:text="${contract.contractNo}">CT202601001</td>
                    <td th:text="${contract.contractName}">流动资金贷款合同</td>
                    <td th:text="${contract.customerName}">深圳市科技有限公司</td>
                    <td th:text="${#numbers.formatDecimal(contract.amount, 1, 'COMMA', 2, 'POINT')}">5,000,000.00</td>
                    <td>
                        <span th:class="${'risk-' + contract.riskLevel}" th:text="${contract.riskLevel}">LOW</span>
                    </td>
                    <td>
                        <span th:class="${'status status-' + contract.status}" th:text="${contract.status}">草稿</span>
                    </td>
                    <td th:text="${#temporals.format(contract.signDate, 'yyyy-MM-dd')}">2026-01-15</td>
                    <td>
                        <a th:href="@{/contracts/{id}(id=${contract.id})}" class="btn btn-primary">查看</a>
                        <a th:href="@{/contracts/{id}/edit(id=${contract.id})}" class="btn btn-warning">编辑</a>
                        <a th:href="@{/contracts/{id}/delete(id=${contract.id})}"
                           class="btn btn-danger"
                           onclick="return confirm('确定要删除吗？')">删除</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(page.records)}">
                    <td colspan="8" style="text-align: center; color: #999;">暂无数据</td>
                </tr>
            </tbody>
        </table>

        <!-- 分页 -->
        <div class="pagination" th:if="${page.pages > 1}">
            <a th:href="@{/(pageNum=1, contractNo=${contractNo}, customerName=${customerName}, status=${status})}">首页</a>
            <a th:href="@{/(pageNum=${page.current - 1}, contractNo=${contractNo}, customerName=${customerName}, status=${status})}"
               th:if="${page.current > 1}">上一页</a>

            <span th:each="i : ${#numbers.sequence(1, page.pages)}">
                <a th:href="@{/(pageNum=${i}, contractNo=${contractNo}, customerName=${customerName}, status=${status})}"
                   th:class="${i == page.current ? 'active' : ''}"
                   th:text="${i}">1</a>
            </span>

            <a th:href="@{/(pageNum=${page.current + 1}, contractNo=${contractNo}, customerName=${customerName}, status=${status})}"
               th:if="${page.current < page.pages}">下一页</a>
            <a th:href="@{/(pageNum=${page.pages}, contractNo=${contractNo}, customerName=${customerName}, status=${status})}">末页</a>
        </div>
    </div>
</body>
</html>
