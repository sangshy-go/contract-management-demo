<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${contract != null ? '编辑合同' : '新建合同'}">新建合同</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .header { background: #1a237e; color: white; padding: 15px 20px; margin: -20px -20px 20px -20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-card { background: white; padding: 30px; border-radius: 8px; }
        .form-title { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #1a237e; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        .form-group label .required { color: #f44336; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;
            box-sizing: border-box; font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: #1a237e;
        }
        .form-row { display: flex; gap: 20px; }
        .form-row .form-group { flex: 1; }
        .btn-group { display: flex; gap: 10px; margin-top: 30px; }
        .btn { padding: 12px 24px; border: none; cursor: pointer; border-radius: 4px; font-size: 14px; }
        .btn-primary { background: #1a237e; color: white; }
        .btn-secondary { background: #9e9e9e; color: white; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏦 银行合同管理系统</h1>
    </div>
    <div class="container">
        <div class="form-card">
            <h2 class="form-title" th:text="${contract != null ? '编辑合同' : '新建合同'}">新建合同</h2>

            <form th:action="${contract != null ? '/contracts/' + contract.id : '/contracts'}"
                  th:object="${contract}"
                  th:method="post">

                <div class="form-row">
                    <div class="form-group">
                        <label>合同编号 <span class="required">*</span></label>
                        <input type="text" th:field="*{contractNo}" placeholder="系统自动生成" readonly>
                    </div>
                    <div class="form-group">
                        <label>合同类型</label>
                        <select th:field="*{contractType}">
                            <option value="LOAN">贷款合同</option>
                            <option value="CREDIT">授信合同</option>
                            <option value="SUPPLY_CHAIN">供应链融资</option>
                            <option value="PROJECT">项目贷款</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>合同名称 <span class="required">*</span></label>
                    <input type="text" th:field="*{contractName}" placeholder="请输入合同名称">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>合同金额(元) <span class="required">*</span></label>
                        <input type="number" step="0.01" th:field="*{amount}" placeholder="请输入金额">
                    </div>
                    <div class="form-group">
                        <label>风险等级</label>
                        <select th:field="*{riskLevel}">
                            <option value="LOW">低风险</option>
                            <option value="MEDIUM">中风险</option>
                            <option value="HIGH">高风险</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>客户名称 <span class="required">*</span></label>
                    <input type="text" th:field="*{customerName}" placeholder="请输入客户名称">
                </div>

                <div class="form-group">
                    <label>客户证件号</label>
                    <input type="text" th:field="*{customerId}" placeholder="请输入统一社会信用代码">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>签署日期</label>
                        <input type="date" th:field="*{signDate}">
                    </div>
                    <div class="form-group">
                        <label>生效日期</label>
                        <input type="date" th:field="*{startDate}">
                    </div>
                    <div class="form-group">
                        <label>到期日期</label>
                        <input type="date" th:field="*{endDate}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>所属部门</label>
                        <select th:field="*{department}">
                            <option value="信贷管理部">信贷管理部</option>
                            <option value="风险管理部">风险管理部</option>
                            <option value="国际业务部">国际业务部</option>
                            <option value="项目融资部">项目融资部</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>客户经理</label>
                        <input type="text" th:field="*{manager}" placeholder="请输入客户经理姓名">
                    </div>
                </div>

                <div class="form-group">
                    <label>备注</label>
                    <textarea th:field="*{remark}" rows="4" placeholder="请输入备注信息"></textarea>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">💾 保存</button>
                    <a href="/" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
