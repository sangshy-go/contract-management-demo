<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${contract != null ? '编辑合同' : '新建合同'}">新建合同 - 银行合同管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['IBM Plex Sans', 'sans-serif'] },
                    colors: {
                        bank: {
                            50: '#f0f4f8', 100: '#d9e2ec', 200: '#bcccdc', 300: '#9fb3c8',
                            400: '#829ab1', 500: '#627d98', 600: '#486581', 700: '#334e68',
                            800: '#243b53', 900: '#102a43', 950: '#0a1a2e',
                        },
                        gold: { 400: '#d69e2e', 500: '#c59a1d', 600: '#b08a1a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bank-50 min-h-screen font-sans">
    <!-- Header -->
    <header class="bg-gradient-to-r from-bank-900 to-bank-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <svg class="w-8 h-8 text-gold-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    <span class="text-white text-xl font-semibold">银行合同管理系统</span>
                </div>
                <nav class="flex space-x-4">
                    <a href="/" class="text-bank-100 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">合同列表</a>
                    <a href="/contracts/new" class="text-bank-100 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">新建合同</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 页面标题 -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-bank-800" th:text="${contract != null ? '编辑合同' : '新建合同'}">新建合同</h1>
            <p class="text-bank-500 mt-1" th:text="${contract != null ? '修改合同信息' : '填写合同基本信息'}">填写合同基本信息</p>
        </div>

        <!-- 表单卡片 -->
        <div class="glass rounded-xl shadow-sm border border-bank-100 p-8">
            <form th:action="${contract != null ? '/contracts/' + contract.id : '/contracts'}"
                  th:object="${contract}"
                  th:method="post">

                <!-- 合同基本信息 -->
                <div class="mb-8">
                    <h3 class="text-lg font-semibold text-bank-800 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-gold-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        合同基本信息
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-bank-600 mb-2">
                                合同编号 <span class="text-red-500">*</span>
                            </label>
                            <input type="text" th:field="*{contractNo}" placeholder="系统自动生成"
                                   readonly class="w-full px-4 py-2.5 border border-bank-200 rounded-lg bg-bank-50 text-bank-400 cursor-not-allowed">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-bank-600 mb-2">
                                合同类型 <span class="text-red-500">*</span>
                            </label>
                            <select th:field="*{contractType}" class="w-full px-4 py-2.5 border border-bank-200 rounded-lg focus:ring-2 focus:ring-bank-500 focus:border-bank-500 outline-none transition-all bg-white">
                                <option value="LOAN">贷款合同</option>
                                <option value="CREDIT">授信合同</option>
                                <option value="SUPPLY_CHAIN">供应链融资</option>
                                <option value="PROJECT">项目贷款</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-6">
                        <label class="block text-sm font-medium text-bank-600 mb-2">
                            合同名称 <span class="text-red-500">*</span>
                        </label>
                        <input type="text" th:field="*{contractName}" placeholder="请输入合同名称"
                               class="w-full px-4 py-2.5 border border-bank-200 rounded-lg focus:ring-2 focus:ring-bank-500 focus:border-bank-500 outline-none transition-all">
                    </div>
                </div>

                <!-- 金额与风险 -->
                <div class="mb-8">
                    <h3 class="text-lg font-semibold text-bank-800 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-gold-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        金额与风险
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-bank-600 mb-2">
                                合同金额(元) <span class="text-red-500">*</span>
                            </label>
                            <div class="relative">
                                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-bank-400">¥</span>
                                <input type="number" step="0.01" th:field="*{amount}" placeholder="0.00"
                                       class="w-full pl-8 pr-4 py-2.5 border border-bank-200 rounded-lg focus:ring-2 focus:ring-bank-500 focus:border-bank-500 outline-none transition-all">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-bank-600 mb-2">风险等级</label>
                            <select th:field="*{riskLevel}" class="w-full px-4 py-2.5 border border-bank-200 rounded-lg focus:ring-2 focus:ring-bank-500 focus:border-bank-500 outline-none transition-all bg-white">
                                <option value="LOW">低风险</option>
                                <option value="MEDIUM">中风险</option>
                                <option value="HIGH">高风险</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 客户信息 -->
                <div class="mb-8">
                    <h3 class="text-lg font-semibold text-bank-800 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-gold-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        客户信息
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-bank-600 mb-2">
                                客户名称 <span class="text-red-500">*</span>
                            </label>
                            <input type="text" th:field="*{customerName}" placeholder="请输入客户名称"
                                   class="w-full px-4 py-2.5 border border-bank-200 rounded-lg focus:ring-2 focus:ring-bank-500 focus:border-bank-500 outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-bank-600 mb-2">客户证件号</label>
                            <input type="text" th:field="*{customerId}" placeholder="请输入统一社会信用代码"
                                   class="w-full px-4 py-2.5 border border-bank-200 rounded-lg focus:ring-2 focus:ring-bank-500 focus:border-bank-500 outline-none transition-all">
                        </div>
                    </div>
                </div>

                <!-- 合同日期 -->
                <div class="mb-8">
                    <h3 class="text-lg font-semibold text-bank-800 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-gold-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        合同日期
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-bank-600 mb-2">签署日期</label>
                            <input type="date" th:field="*{signDate}"
                                   class="w-full px-4 py-2.5 border border-bank-200 rounded-lg focus:ring-2 focus:ring-bank-500 focus:border-bank-500 outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-bank-600 mb-2">生效日期</label>
                            <input type="date" th:field="*{startDate}"
                                   class="w-full px-4 py-2.5 border border-bank-200 rounded-lg focus:ring-2 focus:ring-bank-500 focus:border-bank-500 outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-bank-600 mb-2">到期日期</label>
                            <input type="date" th:field="*{endDate}"
                                   class="w-full px-4 py-2.5 border border-bank-200 rounded-lg focus:ring-2 focus:ring-bank-500 focus:border-bank-500 outline-none transition-all">
                        </div>
                    </div>
                </div>

                <!-- 部门与经理 -->
                <div class="mb-8">
                    <h3 class="text-lg font-semibold text-bank-800 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-gold-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                        </svg>
                        部门与经理
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-bank-600 mb-2">所属部门</label>
                            <select th:field="*{department}" class="w-full px-4 py-2.5 border border-bank-200 rounded-lg focus:ring-2 focus:ring-bank-500 focus:border-bank-500 outline-none transition-all bg-white">
                                <option value="">请选择部门</option>
                                <option value="信贷管理部">信贷管理部</option>
                                <option value="风险管理部">风险管理部</option>
                                <option value="国际业务部">国际业务部</option>
                                <option value="项目融资部">项目融资部</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-bank-600 mb-2">客户经理</label>
                            <input type="text" th:field="*{manager}" placeholder="请输入客户经理姓名"
                                   class="w-full px-4 py-2.5 border border-bank-200 rounded-lg focus:ring-2 focus:ring-bank-500 focus:border-bank-500 outline-none transition-all">
                        </div>
                    </div>
                </div>

                <!-- 备注 -->
                <div class="mb-8">
                    <h3 class="text-lg font-semibold text-bank-800 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-gold-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                        备注信息
                    </h3>
                    <textarea th:field="*{remark}" rows="4" placeholder="请输入备注信息"
                              class="w-full px-4 py-2.5 border border-bank-200 rounded-lg focus:ring-2 focus:ring-bank-500 focus:border-bank-500 outline-none transition-all resize-none"></textarea>
                </div>

                <!-- 按钮组 -->
                <div class="flex items-center gap-4 pt-4 border-t border-bank-100">
                    <button type="submit" class="bg-bank-700 hover:bg-bank-600 text-white px-6 py-2.5 rounded-lg font-medium transition-colors flex items-center gap-2 shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        保存
                    </button>
                    <a href="/" class="px-6 py-2.5 border border-bank-200 text-bank-600 rounded-lg hover:bg-bank-50 transition-colors font-medium">取消</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-bank-900 text-bank-300 py-4 mt-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm">
            <p>&copy; 2026 银行合同管理系统. 版权所有.</p>
        </div>
    </footer>
</body>
</html>
