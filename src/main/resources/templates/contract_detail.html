<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>合同详情</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .header { background: #1a237e; color: white; padding: 15px 20px; margin: -20px -20px 20px -20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 8px; margin-bottom: 20px; }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #1a237e; }
        .info-row { display: flex; margin-bottom: 15px; }
        .info-label { width: 150px; color: #666; }
        .info-value { flex: 1; color: #333; font-weight: 500; }
        .status { padding: 4px 12px; border-radius: 4px; font-size: 14px; }
        .status-DRAFT { background: #fff3e0; color: #ff9800; }
        .status-PENDING { background: #e3f2fd; color: #2196f3; }
        .status-APPROVED { background: #e8f5e9; color: #4caf50; }
        .status-REJECTED { background: #ffebee; color: #f44336; }
        .status-ARCHIVED { background: #f5f5f5; color: #9e9e9e; }
        .btn { padding: 8px 16px; border: none; cursor: pointer; border-radius: 4px; text-decoration: none; display: inline-block; margin-right: 10px; }
        .btn-primary { background: #1a237e; color: white; }
        .btn-success { background: #4caf50; color: white; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-danger { background: #f44336; color: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; width: 120px; }
        .action-bar { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏦 银行合同管理系统</h1>
    </div>
    <div class="container">
        <div class="action-bar">
            <a href="/" class="btn btn-primary">← 返回列表</a>
            <a th:href="@{/contracts/{id}/edit(id=${contract.id})}" class="btn btn-warning">编辑</a>
            <button class="btn btn-success" onclick="approve()">审批</button>
            <button class="btn btn-primary" onclick="archive()">归档</button>
            <a th:href="@{/contracts/{id}/delete(id=${contract.id})}"
               class="btn btn-danger"
               onclick="return confirm('确定要删除吗？')">删除</a>
        </div>

        <!-- 基本信息 -->
        <div class="card">
            <div class="card-title">📋 基本信息</div>
            <div class="info-row">
                <div class="info-label">合同编号</div>
                <div class="info-value" th:text="${contract.contractNo}">CT202601001</div>
            </div>
            <div class="info-row">
                <div class="info-label">合同名称</div>
                <div class="info-value" th:text="${contract.contractName}">流动资金贷款合同</div>
            </div>
            <div class="info-row">
                <div class="info-label">合同类型</div>
                <div class="info-value" th:text="${contract.contractType}">贷款合同</div>
            </div>
            <div class="info-row">
                <div class="info-label">合同金额</div>
                <div class="info-value" th:text="${#numbers.formatDecimal(contract.amount, 1, 'COMMA', 2, 'POINT')} + ' 元'">5,000,000.00 元</div>
            </div>
            <div class="info-row">
                <div class="info-label">风险等级</div>
                <div class="info-value" th:text="${contract.riskLevel}">低风险</div>
            </div>
            <div class="info-row">
                <div class="info-label">状态</div>
                <div class="info-value">
                    <span th:class="${'status status-' + contract.status}" th:text="${contract.status}">已审批</span>
                </div>
            </div>
        </div>

        <!-- 客户信息 -->
        <div class="card">
            <div class="card-title">👤 客户信息</div>
            <div class="info-row">
                <div class="info-label">客户名称</div>
                <div class="info-value" th:text="${contract.customerName}">深圳市科技有限公司</div>
            </div>
            <div class="info-row">
                <div class="info-label">客户证件号</div>
                <div class="info-value" th:text="${contract.customerId ?: '-'}">91440300MA5DQWXJ1A</div>
            </div>
        </div>

        <!-- 日期信息 -->
        <div class="card">
            <div class="card-title">📅 日期信息</div>
            <div class="info-row">
                <div class="info-label">签署日期</div>
                <div class="info-value" th:text="${#temporals.format(contract.signDate, 'yyyy-MM-dd')}">2026-01-15</div>
            </div>
            <div class="info-row">
                <div class="info-label">生效日期</div>
                <div class="info-value" th:text="${#temporals.format(contract.startDate, 'yyyy-MM-dd')}">2026-01-20</div>
            </div>
            <div class="info-row">
                <div class="info-label">到期日期</div>
                <div class="info-value" th:text="${#temporals.format(contract.endDate, 'yyyy-MM-dd')}">2027-01-20</div>
            </div>
        </div>

        <!-- 审批记录 -->
        <div class="card">
            <div class="card-title">✅ 审批记录</div>
            <table>
                <thead>
                    <tr>
                        <th>审批人</th>
                        <th>审批级别</th>
                        <th>审批结果</th>
                        <th>审批意见</th>
                        <th>审批时间</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="record : ${contract.approvalRecords}">
                        <td th:text="${record.approver}">审批员A</td>
                        <td th:text="${'第' + record.approveLevel + '级'}">第1级</td>
                        <td th:text="${record.approveResult}">通过</td>
                        <td th:text="${record.approveComment}">资料完整，同意</td>
                        <td th:text="${#temporals.format(record.approveTime, 'yyyy-MM-dd HH:mm')}">2026-01-16 10:30</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(contract.approvalRecords)}">
                        <td colspan="5" style="text-align: center; color: #999;">暂无审批记录</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function approve() {
            var result = prompt("审批结果（PASS/REJECT）：", "PASS");
            if (result) {
                var comment = prompt("审批意见：", "");
                var form = document.createElement('form');
                form.method = 'POST';
                form.action = '/api/contracts/' + [[${contract.id}]] + '/approve?approver=演示用户&level=1&result=' + result + '&comment=' + encodeURIComponent(comment || '');
                document.body.appendChild(form);
                form.submit();
            }
        }
        function archive() {
            if (confirm('确定要归档此合同吗？')) {
                var form = document.createElement('form');
                form.method = 'POST';
                form.action = '/api/contracts/' + [[${contract.id}]] + '/archive';
                document.body.appendChild(form);
                form.submit();
            }
        }
    </script>
</body>
</html>
